name = "admissions-ai-assistant"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
SESSION_SECRET = "dev_secret_replace_in_production_admissions_ai"
CORS_ORIGIN = "*"
GOOGLE_SHEETS_WEBHOOK_URL = ""
MAX_CHAT_TURNS_HISTORY = "4"
SIMILARITY_SCORE_THRESHOLD = "0.45"
INGEST_SECRET = "dev_ingest_secret_change_me"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "admissions-leads"
database_id = "f3bbfbe1-3d02-4b14-bf3b-f8e2def58fd4"
migrations_dir = "migrations"

# Cloudflare Workers AI binding
[ai]
binding = "AI"

# Cloudflare Vectorize binding (768 dimensions for BGE Base)
[[vectorize]]
binding = "VECTORIZE"
index_name = "admissions-knowledge"

# Cloudflare R2 bucket binding for knowledge documents
[[r2_buckets]]
binding = "R2"
bucket_name = "admissions-docs"
preview_bucket_name = "admissions-docs-preview"
